
<!DOCTYPE html>
<html>
<head>
    <title>Phishing Website Detection</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #0b1220;
            color: white;
            margin: 0;
            padding: 30px;
        }

        .container {
            max-width: 750px;
            margin: auto;
            background: #172338;
            padding: 30px;
            border-radius: 15px;
        }

        h1 {
            text-align: center;
            color: #38bdf8;
        }

        p {
            text-align: center;
            color: #cbd5e1;
        }

        textarea {
            width: 100%;
            height: 170px;
            box-sizing: border-box;
            padding: 15px;
            border-radius: 8px;
            margin-top: 20px;
            font-size: 14px;
        }

        button {
            width: 100%;
            padding: 15px;
            margin-top: 15px;
            background: #0284c7;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 17px;
            cursor: pointer;
        }

        #result {
            margin-top: 20px;
            text-align: center;
            font-size: 20px;
            font-weight: bold;
        }
    </style>
</head>

<body>
<div class="container">

    <h1>🛡️ Phishing Website Detection</h1>

    <p>Machine Learning Based Website Security Scanner</p>

    <h3>Enter 28 Website Features</h3>

    <p>Enter 28 comma-separated values (-1, 0, 1)</p>

    <textarea id="features"
    placeholder="Example: 1, -1, 0, 1, ..."></textarea>

    <button onclick="detectWebsite()">
        Detect Phishing
    </button>

    <div id="result"></div>

</div>

<script>
async function detectWebsite() {

    const input = document.getElementById("features").value;

    const values = input.split(",").map(x => Number(x.trim()));

    const result = document.getElementById("result");

    if (values.length !== 28 ||
        values.some(x => ![-1, 0, 1].includes(x))) {
        result.innerText =
            "Please enter exactly 28 values (-1, 0, 1).";
        return;
    }

    result.innerText = "Scanning website...";

    try {
        const response = await fetch("/predict", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({values: values})
        });

        const data = await response.json();

        if (!response.ok) {
            throw new Error(data.detail || "Prediction failed");
        }

        result.innerHTML = `
    <h2>${data.result}</h2>
    <h3>Security Recommendations</h3>
    <ul style="text-align:left; color:white;">
        <li>Always verify the website URL before entering personal information.</li>
        <li>Never share passwords or OTPs on suspicious websites.</li>
        <li>Check for HTTPS and a valid security certificate.</li>
    </ul>
`;

    } catch (error) {
       result.innerHTML = `
    <h2>${data.result}</h2>
    <h3>Security Recommendations</h3>
    <ul style="text-align:left; color:white;">
        <li>Always verify the website URL before entering personal information.</li>
        <li>Never share passwords or OTPs on suspicious websites.</li>
        <li>Check for HTTPS and a valid security certificate.</li>
    </ul>
`;
    }
}
</script>

</body>
</html>
